# Tecno Pova (LD7J), codename POVA.

device pova
	title       Tecno Pova (LD7j, Pova)
	vendor      tecno
	soc         mt6768
	defconfig   pova_defconfig
	maintainer  HakiOS MT6768 port contributors
	status      display     works     Pova SimpleFb GOP verified (720x1640, Stride 720, Novatek NT36525B @ 0x7e9f0000, length 0x01500000)
	status      cpu         works     MT6768 6+2 MPIDR affinity (6x A55 @ 1.8 GHz + 2x A75 @ 2.0 GHz); boot core 7, PSCI via SMC conduit
	status      storage     works     MT6768 MSDC0 eMMC at 0x11230000 (eMMC 5.1 HS400, direct block service and Darwin root /dev/disk0s1)
	status      touch       works     FocalTech SPI touch screen on MT6768 SPI2 (0x11012000) with coordinate normalization to 65535 and multi-touch reporting to /dev/hakios-touch
	status      buttons     works     MT6768 Keypad (0x10010000), MT6358 PMIC PWRKEY and HOMEKEY over PWRAP (0x1000D000)
	status      gpu         works     ARM Mali-G52 2EEMC2 (Bifrost v7, 950 MHz) at 0x13000000 / 0x13040000; HakiosMali DRM service
	status      battery     works     MT6358 PMIC fuel gauge via PWRAP reading voltage, current, and temperature; HakiosBattery IOPMPowerSource reporting
	status      thermal     works     MT6768 AUXADC/LVTS thermal sensors exposed via sysctl kern.hakios.thermal_soc
	status      usb         works     Generic UEFI USB class stack and XnuLoader fastboot USB communication over MT6768 SSUSB / xHCI
	status      wifi        partial   MT6768 CONNSYS at 0x18002000 (MT6631/MT6635 combo radio); SPM power sequence, CONSYS_IP_VER and WMT handshake
	status      bluetooth   partial   MT6768 CONNSYS BTIF / STP transport interface
	status      audio       missing   no MT6768 audio path
	status      camera      missing   no camera path
	status      haptic      missing   no haptic path
